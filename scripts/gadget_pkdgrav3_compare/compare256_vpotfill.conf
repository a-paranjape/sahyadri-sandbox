# pkdgrav3 side of compare256.conf, VAHC resubmitted after job 2536704 reached its 4 h walltime (node shared,
# ~18 min per 4 snapshots): no --overwrite, so snapshots that already have .vahc and .vpot are skipped and the others
# get only the missing .vpot (their .vahc, from the slow AddValue path, is bit-identical to vahc_fast's; checked at
# z = 0 for both codes). vahc_prev/ keeps the pre-rerun .vahc either way.
source "$(dirname "${BASH_SOURCE[0]}")/compare256.conf"
PP_OVERWRITE=0; PP_WALL=08:00:00
