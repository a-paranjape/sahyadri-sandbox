# Gadget-4 vs pkdgrav3 from the same initial conditions, 256^3, Sahyadri default cosmology and settings, on pawna.
# As compare32.conf with NPART = 256, resources for 256^3, the full halo pipeline (Rockstar, consistent-trees with
# the production catalogue threshold, VAHC) for both codes, and profiles in comoving Mpc/h out to 50 Mpc/h.
# One config for both codes (bash, sourced by every job through pkdgrav3_pipeline/pipeline_env.sh):
#   compare256.conf         pkdgrav3 run + its Rockstar/consistent-trees (pkdgrav3_pipeline stages)
#   compare256_gadget.conf  sets SIM_CODE=gadget4, then sources this file: Gadget-4 run + its Rockstar/consistent-trees
# Submit everything with submit_compare.sh compare256.conf (see README.md).

# ---------------------------------------------------------------- where things are
ROOT=/storage/$USER/pkdgrav3_io/potcmp
SANDBOX=$ROOT/sahyadri-sandbox                    # this repository (branch rockstar-pkc-reader)
PKD_IO_ROOT=/storage/$USER/pkdgrav3_io             # pkdgrav3 install (branch main of shadaba/pkdgrav3)
CODES=/storage/$USER/pipeline_test/codes           # Rockstar (PKC + AREPO/Gadget-4 HDF5), consistent-trees, venv
G4HOME=$ROOT/g4home                               # Gadget-4 builds: $G4HOME/code/Gadget-4/mesh<2N>[-NGenIC]/Gadget4
G4_SRC=/user/$USER/Projects/code/Gadget-4/gadget4 # Gadget-4 source of the Sahyadri builds (commit 1e171a4), copied
CLASS_EXEC=/user/$USER/Projects/code/Class/class_public/class
SCRATCH=$ROOT/data
LOGS=$SCRATCH/logs

# ---------------------------------------------------------------- run (Sahyadri default: config/submit/sahyadri/sub_default.conf)
SIM_CODE=${SIM_CODE:-pkdgrav3}
REAL=1
NPART=256
LBOX=200.0
SEED=12345678
Z_START=49
HUBBLE=0.6736
OMEGA_M=0.3137721
OMEGA_B=0.0493017                                 # Gadget-4 parameter / CLASS only; both runs are dark matter only
OMEGA_K=0.0
OMEGA_L=0.6862279
OMEGA_DE=0.0; W0=-1.0; WA=0.0
NS=0.9649
AS=2.098903e-09
SIGMA8=0.811                                      # not used (CLASS spectrum is normalised with A_s)
OUTPUTS_TXT=$SANDBOX/config/sims/outputs100.txt   # Sahyadri's 100 output times; Gadget-4 adds a = 1
GADGET_STEM=potcmp/gadget$NPART
GADGET_DIR=$SCRATCH/sims/$GADGET_STEM/r$REAL
G4_NCPU=64; G4_MEM=160gb; G4_WALL=12:00:00; G4_MAXMEM=2000     # MaxMemSize per MPI rank (MB)

# softening: Sahyadri Gadget-4 FORCE_RES = LBOX/NPART/30 (0.003255208 at 2048^3); production pkdgrav3 dSoft = 1/(60 N)
# (8.138e-6 at 2048^3, sahyadri2048.par). Rockstar FORCE_RES = the Gadget-4 softening for both runs.
FORCE_RES=$(awk -v l=$LBOX -v n=$NPART 'BEGIN{printf "%.9g", l/n/30}')

# ---------------------------------------------------------------- pkdgrav3 (pkdgrav3_pipeline/make_pkdgrav3_par.py)
STEM=potcmp/pkd$NPART
IC_FILE=$GADGET_DIR/ics/ics_gadget2.dat           # the Gadget-4 NGenIC ICs, converted by gadget4_ic_to_gadget2.py
TF_FILE=                                          # not used with IC_FILE
# outputs at the times Gadget-4 actually wrote its snapshots (as production pkdgrav3: dRedTo = Gadget's Redshift
# attributes); 20 steps between outputs as sahyadri2048.par. The file is written by job_gadget.pbs.
OUT_Z=$(cat "$GADGET_DIR/gadget_out_z.txt" 2>/dev/null || true)
STEPS=$(for z in $OUT_Z; do printf '20 '; done)
SUBSAMPLES="1,3,5,9,10,12,15,20,25"
ALSO_HDF5=1                                       # HDF5 too: float32 potential and positions for the comparison
EXTRA_PAR="dSoft = 1.0/(60*$NPART); dCompPotStep = 1.0"
SIM_NCPU=64;   SIM_MEM=160gb;  SIM_WALL=12:00:00

# ---------------------------------------------------------------- Rockstar / consistent-trees (both codes)
RS_NCPU=16;    RS_MEM=64gb;    RS_WALL=10:00:00
CT_NCPU=8;     CT_MEM=64gb;    CT_WALL=10:00:00
RS_NUM_BLOCKS=4
RS_WRITERS=16
RS_PKC_SUBSAMPLES=""
MIN_HALO_OUTPUT_SIZE=30
MIN_HALO_PARTICLES=20
UNBOUND_THRESHOLD=0.5
CT_MIN_LIST_BYTES=                                # production threshold (gen_merger_cfg.pl: catalogues < 20000 B skipped)
CLEAN_ROCKSTAR=0                                  # keep out_*.list, halos_*.bin (member particle IDs) and hlists
# VAHC (job_vahc.pbs, run_addvalue.py): production grid 512, all particles; .tens not needed here
PP_GRID=512; PP_DOWN_TO=0; PP_TENS=0; PP_NPROC=8; PP_NCPU=16; PP_MEM=250gb; PP_WALL=30:00:00
# (measured at 256^3: ~23 GB and 20-40 min per snapshot and process; 4 processes did not fit 94 snapshots in 10 h)
# rerun 2026-11-12 with vahc_fast (PP_FAST=1, default) and .vpot (PP_POT=1; Gadget-4 through vpot_hdf5.py), all
# snapshots recomputed (PP_OVERWRITE=1, old files kept in vahc_prev/): measured on the Mac at z = 0, grid 512,
# 8 threads: 2 min and 7-8.5 GB per snapshot
PP_FAST=1; PP_POT=1; PP_OVERWRITE=1; PP_NPROC=4; PP_NCPU=16; PP_MEM=96gb; PP_WALL=12:00:00   # 4 h was too short on a shared node (~18 min per 4 snapshots)
FITS_NPROC=4; FITS_NCPU=4; FITS_MEM=32gb; FITS_WALL=03:00:00; FITS_DELETE_ASCII=0   # keep the ASCII files

# ---------------------------------------------------------------- comparison (compare_potential.py)
CMP_DIR=$SCRATCH/compare/pkd${NPART}_vs_gadget${NPART}_r$REAL
CMP_NCPU=16; CMP_MEM=128gb; CMP_WALL=10:00:00
CMP_ARGS="--every 5"                             # every 5th output (+ the PROF_Z ones and z = 0)
CMP_PKD_STAGES=sim,rockstar,ctrees,vahc           # pipeline stages run by submit_compare.sh
CMP_G4_STAGES=rockstar,ctrees,vahc
# stacked potential profiles around halos (halo_potential_profile.py), each code with its own halos
PROF_Z="3 1 0.5 0"                                # outputs closest to these redshifts
PROF_MBINS=2e12,1e13,5e13,2e14,1e16              # Mvir bin edges (Msun/h); particle mass 4.15e10 Msun/h
PROF_RBINS=0.02,50,36                             # comoving Mpc/h: min, max, number of log bins
PROF_ARGS=""

if [ "$SIM_CODE" = gadget4 ]; then
  STEM=$GADGET_STEM                               # sims/<STEM>/r<REAL> = GADGET_DIR, halos/<STEM>/r<REAL>
  RS_NUM_BLOCKS=1                                 # one snapshot file per output
fi
