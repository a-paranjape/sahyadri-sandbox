# Sahyadri pkdgrav3 pipeline: one run = one config file (bash syntax, sourced by every job).
# Smoke test (128^3, 5 outputs, ~1 h in total on part of a node). Copy, edit, then:  scripts/pkdgrav3_pipeline/submit_pipeline.sh my_run.conf
# Paths below are for user shadab on pawna; replace $USER paths with yours.

# ---------------------------------------------------------------- where things are
SANDBOX=/storage/$USER/pipeline_test/sahyadri-sandbox
PKD_IO_ROOT=/storage/$USER/pkdgrav3_io             # pkdgrav3 install (pkdgrav3 docs/running_on_pawna.md)
CODES=/storage/$USER/pipeline_test/codes
SCRATCH=/storage/$USER/pipeline_test/data
LOGS=$SCRATCH/logs                                # job logs

# ---------------------------------------------------------------- run
STEM=pkdtest/lcdm128
REAL=1
NPART=128
LBOX=200.0                                        # Mpc/h
SEED=314159265
# cosmology (flat LCDM here). For w0-wa: OMEGA_L=0, OMEGA_DE=1-OMEGA_M, W0, WA.
HUBBLE=0.6736
OMEGA_M=0.3137721
OMEGA_L=0.6862279
OMEGA_DE=0.0
W0=-1.0
WA=0.0
SIGMA8=0.81
NS=0.965
TF_FILE=$PKD_IO_ROOT/pkdgrav3/examples/euclid_z0_transfer_combined.dat   # transfer function at z=0
Z_START=49
# outputs: one snapshot at each redshift in OUT_Z (decreasing), STEPS[i] time steps to reach OUT_Z[i]
OUT_Z="3 2 1 0.5 0"
STEPS="16 8 8 6 8"
SUBSAMPLES="1,3,5,9,10,12,15,20,25"              # .pkc subsample percents (sum 100)
ALSO_HDF5=0                                       # 1: also write standard HDF5 snapshots (validation only)
EXTRA_PAR=""                                      # extra pkdgrav3 parameter lines, e.g. "dCompPotStep = 0.0"

# ---------------------------------------------------------------- resources (one pawna node = 192 cores, 755 GB)
SIM_NCPU=32;   SIM_MEM=64gb;   SIM_WALL=01:00:00
RS_NCPU=8;     RS_MEM=32gb;    RS_WALL=01:00:00
CT_NCPU=2;     CT_MEM=16gb;    CT_WALL=01:00:00
PP_NCPU=8;     PP_MEM=64gb;    PP_WALL=02:00:00
FITS_NCPU=8;   FITS_MEM=32gb;  FITS_WALL=01:00:00

# ---------------------------------------------------------------- halo finding (Rockstar, native .pkc reader)
FORCE_RES=""                                      # comoving Mpc/h; empty = LBOX/NPART/50 (pkdgrav3 default softening)
RS_NUM_BLOCKS=8                                   # reader processes (<= RS_WRITERS)
RS_WRITERS=8
RS_PKC_SUBSAMPLES=""                              # "" = all particles (production); e.g. "1,3" for a quick look
MIN_HALO_OUTPUT_SIZE=30                           # production template values
MIN_HALO_PARTICLES=20
UNBOUND_THRESHOLD=0.5

# ---------------------------------------------------------------- merger trees
CLEAN_ROCKSTAR=1                                  # 1: clean_trees.pl (keep out_<snap>.trees, logs/; delete
                                                  #    out_*.list, halos_*.bin/.ascii, hlists/, outputs/)

# ---------------------------------------------------------------- value added catalogs (.vahc, .tens)
PP_GRID=128
PP_DOWN_TO=0                                      # 0 = all particles (production; streamed, no extra memory); N: random N^3
PP_TENS=1                                         # 1: also .tens
PP_NPROC=5                                        # snapshots in parallel (memory ~ 12*16*PP_GRID^3 B each)

# ---------------------------------------------------------------- FITS
FITS_NPROC=8
FITS_DELETE_ASCII=0                               # 1: delete ASCII after verified FITS (check log first!)
